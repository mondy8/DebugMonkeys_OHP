# pnpm の設定ファイル。
# pnpm v11 以降 .npmrc は認証情報専用になり、通常の設定はこちらに記述する。
# 参照: https://pnpm.io/settings

# 公開直後のバージョンを取り込まない（単位: 分 / 1440 = 24時間）。
# 乗っ取られたパッケージが公開直後に取り込まれる事故を防ぐ。
# pnpm v11 以降はこれがデフォルトだが、意図を明示するため記述する。
minimumReleaseAge: 1440

# 依存パッケージの install 系ライフサイクルスクリプトは既定で全て遮断される
# （strictDepBuilds がデフォルト true のため、未承認のものがあると install が失敗する）。
# 実行可否を明示したパッケージだけをここに列挙する。
#   false = 実行しない / true = 実行を許可する
# unrs-resolver: eslint-config-next 由来の dev 依存。prebuilt バイナリで動くため不要。
allowBuilds:
  unrs-resolver: false

# pnpm add 時にバージョンをキャレットではなく固定で記録する。
saveExact: true
